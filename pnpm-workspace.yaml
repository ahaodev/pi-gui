packages:
  - apps/*
  - packages/*
  - video

# Dependencies allowed to run install scripts (postinstall, etc.).
# pnpm 10+ skips these by default; electron's postinstall downloads the
# runtime binary, node-pty/sharp need native builds, esbuild verifies its
# platform binary, and electron-winstaller prepares its NSIS templates.
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - node-pty
  - sharp
